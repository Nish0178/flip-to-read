services:
  flip-to-read:
    build:
      context: .
      dockerfile: Dockerfile
    image: flip-to-read:latest
    container_name: flip-to-read-app
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    environment:
      - PORT=${PORT:-8080}
      - PYTHON_CMD=python3
      - PYTHON_SCRIPT=python-service/convert.py
      - STORAGE_DIR=/app/storage/books
      - APP_DPI=${APP_DPI:-150}
      - MAX_FILE_SIZE=${MAX_FILE_SIZE:-50MB}
      - MAX_REQUEST_SIZE=${MAX_REQUEST_SIZE:-50MB}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
    restart: unless-stopped
