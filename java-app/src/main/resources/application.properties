server.port=${PORT:8080}

# Upload limits (Default: 1GB, configurable via MAX_FILE_SIZE and MAX_REQUEST_SIZE)
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:1GB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:1GB}
spring.servlet.multipart.file-size-threshold=2MB
app.max-file-size-bytes=${MAX_FILE_SIZE_BYTES:1073741824}

# Python converter (use "python3" on Linux/macOS, "python" or "py" on Windows)
app.python=${PYTHON_CMD:python}
app.python-script=${PYTHON_SCRIPT:python-service/convert.py}
app.dpi=${APP_DPI:180}
app.image-format=${APP_IMAGE_FORMAT:jpg}

# Where converted flipbooks are stored
app.storage-dir=${STORAGE_DIR:storage/books}

# Optional extra CORS allowed origins for production (comma-separated, e.g. https://fliptoread.com)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

