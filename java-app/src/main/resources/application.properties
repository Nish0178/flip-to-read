server.port=8080

# Upload limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Python converter (use "python3" on Linux/macOS, "python" or "py" on Windows)
app.python=python
app.python-script=../python-service/convert.py
app.dpi=110

# Where converted flipbooks are stored
app.storage-dir=storage/books
