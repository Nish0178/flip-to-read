<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Flip to Read</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="logo-icon.png">
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
  <style>
    .resume-toast {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(38, 70, 83, 0.95);
      backdrop-filter: blur(8px);
      color: #fff;
      padding: 10px 18px;
      border-radius: 30px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 0.88rem;
      font-weight: 500;
      z-index: 1000;
    }
    .btn-resume-action {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 16px;
      padding: 4px 12px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn-resume-action:hover {
      opacity: 0.9;
    }
    .btn-resume-dismiss {
      background: rgba(255,255,255,0.18);
      color: #fff;
      border: none;
      border-radius: 16px;
      padding: 4px 10px;
      font-size: 0.82rem;
      cursor: pointer;
    }
  </style>
</head>
<body class="reader-body">

  <div class="reader-container" id="reader-app">

    <!-- Top Reader Toolbar -->
    <header class="reader-header" id="reader-header">
      <div class="reader-header-left">
        <a href="/" class="reader-brand-link" id="btn-nav-home" aria-label="Back to Flip to Read" title="Back to Flip to Read">
          <img src="logo-icon.png" alt="Flip to Read" class="reader-brand-icon">
          <span class="reader-brand-text">
            <span class="brand-flip">Flip</span> <span class="brand-to">to</span> <span class="brand-read">Read</span>
          </span>
        </a>

        <div class="reader-divider"></div>
        <div class="reader-book-title" id="book-title" title="Flipbook Document">Loading book...</div>
      </div>

      <!-- Center Page Counter & Jump Popover -->
      <div class="reader-header-center">
        <div class="page-jump-wrapper">
          <button type="button" class="page-counter-badge" id="btn-page-badge" title="Click to jump to a specific page">
            <span id="page-counter-text">Page ...</span>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
              <path d="M7 10l5 5 5-5z"/>
            </svg>
          </button>
          <div class="page-jump-popover" id="page-jump-popover">
            <label for="jump-input" style="font-size: 0.8rem; color: var(--text-muted);">Go to:</label>
            <input type="number" id="jump-input" class="page-jump-input" min="1" value="1">
            <button type="button" class="btn-jump-go" id="btn-jump-go">Go</button>
          </div>
        </div>
      </div>

      <!-- Right Action Toolbar -->
      <div class="reader-header-right">
        <!-- Download Dropdown -->
        <div class="download-dropdown-wrapper">
          <button type="button" class="btn-toolbar" id="btn-download-menu" title="Download Options" aria-haspopup="true">
            <svg viewBox="0 0 24 24">
              <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z"/>
            </svg>
            <span>Download</span>
            <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor" style="margin-left: 2px;">
              <path d="M7 10l5 5 5-5z"/>
            </svg>
          </button>
          <div class="download-dropdown-menu" id="download-dropdown-menu" role="menu">
            <a id="download-pdf-link" class="download-menu-item" href="#" role="menuitem">
              <div class="download-item-left">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="#E76F51">
                  <path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/>
                </svg>
                <span>Download PDF</span>
              </div>
              <span class="download-badge">PDF</span>
            </a>
            <a id="download-html-link" class="download-menu-item" href="#" role="menuitem" title="Download single standalone HTML interactive book">
              <div class="download-item-left">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="#2A9D8F">
                  <path d="M19 2H6c-1.2 0-2 .8-2 2v16c0 1.2.8 2 2 2h13c.6 0 1-.4 1-1V3c0-.6-.4-1-1-1zm-1 18H6.5c-.3 0-.5-.2-.5-.5s.2-.5.5-.5H18V20zm0-3H6.5c-.8 0-1.5.7-1.5 1.5V4.5c0-.3.2-.5.5-.5H18v13z"/>
                </svg>
                <span>Download Flipbook</span>
              </div>
              <span class="download-badge html-badge">HTML</span>
            </a>
            <a id="download-zip-link" class="download-menu-item" href="#" role="menuitem">
              <div class="download-item-left">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="#E76F51">
                  <path d="M20 6h-8l-2-2H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-6 10H8v-2h6v2zm4-4H8v-2h10v2z"/>
                </svg>
                <span>Download Offline Flipbook</span>
              </div>
              <span class="download-badge">ZIP</span>
            </a>
          </div>
        </div>

        <!-- Fullscreen Button -->
        <button type="button" class="btn-toolbar" id="btn-fullscreen" title="Toggle Fullscreen">
          <svg id="fullscreen-icon" viewBox="0 0 24 24">
            <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
          </svg>
          <span id="fullscreen-text">Fullscreen</span>
        </button>

        <!-- New PDF Button -->
        <a href="/" id="btn-new-pdf" class="btn-toolbar" style="background: var(--accent-light); border-color: var(--accent-border); color: var(--accent);" title="Upload Another PDF">
          <span>+ New PDF</span>
        </a>

      </div>
    </header>

    <!-- Main Viewport (Zero body scroll, auto-fit book stage) -->
    <main class="reader-viewport" id="reader-viewport">
      <!-- Loading Overlay -->
      <div class="reader-overlay" id="loading-overlay">
        <div class="reader-spinner"></div>
        <div class="overlay-msg" id="loading-msg">Preparing your flipbook...</div>
      </div>

      <!-- Error Overlay (Hidden by default) -->
      <div class="reader-overlay" id="error-overlay" style="display: none;">
        <div class="reader-error-card">
          <svg viewBox="0 0 24 24">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
          </svg>
          <div class="reader-error-title" id="error-title">Flipbook Not Found</div>
          <div class="reader-error-desc" id="error-desc">We couldn't locate this book. It may have expired or been deleted.</div>
          <a href="/" class="btn-create" style="margin-top: 10px; text-decoration: none;">Create New Flipbook</a>
        </div>
      </div>

      <!-- Center Book Stage -->
      <div id="book-stage">
        <div id="book"></div>
      </div>

      <!-- Resume Reading Toast -->
      <div class="resume-toast" id="resume-toast" style="display: none;">
        <span id="resume-toast-text">Continue from page 1?</span>
        <div style="display: flex; gap: 8px;">
          <button type="button" class="btn-resume-action" id="btn-resume-continue">Continue</button>
          <button type="button" class="btn-resume-dismiss" id="btn-resume-start">Start Over</button>
        </div>
      </div>
    </main>

    <!-- Bottom Controls Bar -->
    <footer class="reader-controls-bar" id="reader-controls-bar">
      <button type="button" class="btn-ctrl" id="btn-prev" aria-label="Previous Page">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span>Prev</span>
      </button>

      <div style="font-size: 0.88rem; font-weight: 600; color: var(--text-muted);" id="bottom-counter">
        Page 1 / 1
      </div>

      <button type="button" class="btn-ctrl" id="btn-next" aria-label="Next Page">
        <span>Next</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>
    </footer>

  </div>

  <!-- PDF.js Core Library -->
  <script src="/pdfjs/pdf.min.js"></script>

  <!-- Local PageFlip Library -->
  <script src="page-flip.browser.js"></script>

  <!-- Application Logic -->
  <script>
    (function () {
      const id = new URLSearchParams(window.location.search).get('id');

      const bookTitleEl = document.getElementById('book-title');
      const pageCounterText = document.getElementById('page-counter-text');
      const bottomCounter = document.getElementById('bottom-counter');
      const btnPageBadge = document.getElementById('btn-page-badge');
      const jumpPopover = document.getElementById('page-jump-popover');
      const jumpInput = document.getElementById('jump-input');
      const btnJumpGo = document.getElementById('btn-jump-go');

      const btnDownloadMenu = document.getElementById('btn-download-menu');
      const downloadDropdown = document.getElementById('download-dropdown-menu');
      const downloadPdfLink = document.getElementById('download-pdf-link');
      const downloadHtmlLink = document.getElementById('download-html-link');
      const downloadZipLink = document.getElementById('download-zip-link');

      const btnFullscreen = document.getElementById('btn-fullscreen');
      const fullscreenText = document.getElementById('fullscreen-text');

      const btnPrev = document.getElementById('btn-prev');
      const btnNext = document.getElementById('btn-next');

      const viewportEl = document.getElementById('reader-viewport');
      const bookStageEl = document.getElementById('book-stage');
      const loadingOverlay = document.getElementById('loading-overlay');
      const errorOverlay = document.getElementById('error-overlay');
      const errorTitle = document.getElementById('error-title');
      const errorDesc = document.getElementById('error-desc');

      let flip = null;
      let bookMeta = null;
      let isInitialized = false;

      // Handle Missing ID immediately
      if (!id || !/^[a-f0-9]{12}$/.test(id)) {
        showError("Invalid Flipbook ID", "No valid flipbook identifier was provided. Please upload a PDF to create one.");
        return;
      }

      // Configure download links
      downloadPdfLink.href = getFlipApiUrl('/api/books/' + encodeURIComponent(id) + '/pdf');
      downloadHtmlLink.href = getFlipApiUrl('/api/books/' + encodeURIComponent(id) + '/flipbook');
      downloadZipLink.href = getFlipApiUrl('/api/books/' + encodeURIComponent(id) + '/download');

      // Download dropdown toggling
      btnDownloadMenu.addEventListener('click', (e) => {
        e.stopPropagation();
        downloadDropdown.classList.toggle('active');
        jumpPopover.classList.remove('active');
      });

      // Jump Popover toggling
      btnPageBadge.addEventListener('click', (e) => {
        e.stopPropagation();
        jumpPopover.classList.toggle('active');
        downloadDropdown.classList.remove('active');
        if (jumpPopover.classList.contains('active')) {
          jumpInput.focus();
          jumpInput.select();
        }
      });

      // Close popups on document click
      document.addEventListener('click', () => {
        downloadDropdown.classList.remove('active');
        jumpPopover.classList.remove('active');
      });

      // Navigation actions
      const btnHome = document.getElementById('btn-nav-home');
      if (btnHome) {
        btnHome.addEventListener('click', (e) => {
          e.preventDefault();
          window.location.href = '/';
        });
      }

      const btnNewPdf = document.getElementById('btn-new-pdf');
      if (btnNewPdf) {
        btnNewPdf.addEventListener('click', (e) => {
          e.preventDefault();
          window.location.href = '/';
        });
      }

      const PLACEHOLDER = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='800' height='1100'><rect width='100%' height='100%' fill='%23ffffff'/><circle cx='400' cy='550' r='18' fill='none' stroke='%232a9d8f' stroke-width='3' stroke-dasharray='60 30'/><text x='400' y='600' fill='%23527179' font-size='15' text-anchor='middle' font-family='sans-serif'>Rendering...</text></svg>";

      let pdfDoc = null;
      const renderCache = new Map();
      const renderTasks = new Map();
      let renderQueue = Promise.resolve();

      async function doRenderPage(pageNum, targetW, targetH) {
        if (!pdfDoc) return null;
        const page = await pdfDoc.getPage(pageNum);
        const unscaledVp = page.getViewport({ scale: 1.0 });

        // High-resolution scale calculation: preserves crisp vector quality on all displays
        const dpr = Math.min(Math.max(window.devicePixelRatio || 1, 1), 3);
        const baseScale = targetW / unscaledVp.width;
        // Quality multiplier: 2.0x display resolution, ensuring minimum scale of 2.2 (~160-200 DPI minimum)
        let scale = Math.max(baseScale * dpr * 2.0, 2.2);

        let vp = page.getViewport({ scale: scale });
        const MAX_CANVAS_DIM = 4096;
        if (vp.width > MAX_CANVAS_DIM || vp.height > MAX_CANVAS_DIM) {
          const cap = Math.min(MAX_CANVAS_DIM / vp.width, MAX_CANVAS_DIM / vp.height);
          scale *= cap;
          vp = page.getViewport({ scale: scale });
        }

        const canvas = document.createElement('canvas');
        canvas.width = Math.round(vp.width);
        canvas.height = Math.round(vp.height);
        const ctx = canvas.getContext('2d', { alpha: false });
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        await page.render({
          canvasContext: ctx,
          viewport: vp,
          intent: 'display'
        }).promise;

        console.log(`[Diagnostic] Page ${pageNum}: PDF page size: ${Math.round(unscaledVp.width)}x${Math.round(unscaledVp.height)}, viewport: ${Math.round(vp.width)}x${Math.round(vp.height)}, dpr: ${dpr}, render scale: ${scale.toFixed(2)}, canvas backing: ${canvas.width}x${canvas.height}, target display: ${Math.round(targetW)}x${Math.round(targetH)}`);

        return canvas;
      }

      function renderPage(pageNum, targetW, targetH) {
        if (renderCache.has(pageNum)) {
          return Promise.resolve(renderCache.get(pageNum));
        }
        if (renderTasks.has(pageNum)) {
          return renderTasks.get(pageNum);
        }

        const task = new Promise((resolve) => {
          renderQueue = renderQueue.then(async () => {
            if (renderCache.has(pageNum)) {
              resolve(renderCache.get(pageNum));
              return;
            }
            try {
              const canvas = await doRenderPage(pageNum, targetW, targetH);
              renderCache.set(pageNum, canvas);

              if (renderCache.size > 24) {
                const curr = (flip ? flip.getCurrentPageIndex() : 0) + 1;
                for (let [k, c] of renderCache.entries()) {
                  if (Math.abs(k - curr) > 10) {
                    if (typeof HTMLCanvasElement !== 'undefined' && c instanceof HTMLCanvasElement) {
                      c.width = 1;
                      c.height = 1;
                    }
                    renderCache.delete(k);
                  }
                }
              }
              resolve(canvas);
            } catch (err) {
              console.error('Failed to render page', pageNum, err);
              const fmt = bookMeta.format || 'jpg';
              resolve(getFlipApiUrl(`/books/${id}/page-${pageNum}.${fmt}`));
            } finally {
              renderTasks.delete(pageNum);
            }
          });
        });

        renderTasks.set(pageNum, task);
        return task;
      }

      function applyPageImageToFlip(pageIndex, source) {
        const collection = flip ? flip.getPageCollection() : null;
        if (!collection || !collection.pages) return;
        const pageObj = collection.pages[pageIndex];
        if (!pageObj) return;

        if (typeof HTMLCanvasElement !== 'undefined' && source instanceof HTMLCanvasElement) {
          if (pageObj.image === source && pageObj.isLoad) return;
          pageObj.image = source;
          pageObj.isLoad = true;
          if (flip.getRender()) flip.getRender().drawFrame();
          return;
        }

        if (typeof source === 'string') {
          if (pageObj.image && pageObj.image.src === source && pageObj.isLoad) {
            return;
          }

          let loadRetries = 0;
          function tryLoadImage() {
            const img = new Image();
            img.onload = () => {
              pageObj.image = img;
              pageObj.isLoad = true;
              if (flip.getRender()) flip.getRender().drawFrame();
            };
            img.onerror = () => {
              if (loadRetries < 6) {
                loadRetries++;
                setTimeout(tryLoadImage, 1000);
              } else {
                console.error('Image load failed for page index', pageIndex);
                pageObj.isLoad = true;
              }
            };
            img.src = source;
            if (img.complete && img.naturalWidth > 0) {
              pageObj.image = img;
              pageObj.isLoad = true;
              if (flip.getRender()) flip.getRender().drawFrame();
            }
          }
          tryLoadImage();
        }
      }

      function getSpreadPages(pageIndex) {
        if (!flip || !flip.getPageCollection()) return [pageIndex + 1];
        const col = flip.getPageCollection();
        const spIdx = col.getSpreadIndexByPage(pageIndex);
        if (spIdx !== null && col.getSpread && col.getSpread()[spIdx]) {
          return col.getSpread()[spIdx].map(i => i + 1);
        }
        return [pageIndex + 1];
      }

      async function warmPagesAround(pageIndex, targetW, targetH) {
        if (!pdfDoc) return;
        const pagesToWarm = new Set();
        getSpreadPages(pageIndex).forEach(p => pagesToWarm.add(p));

        if (pageIndex + 2 < bookMeta.pages) {
          getSpreadPages(pageIndex + 2).forEach(p => pagesToWarm.add(p));
        }
        if (pageIndex - 1 >= 0) {
          getSpreadPages(pageIndex - 1).forEach(p => pagesToWarm.add(p));
        }
        if (pageIndex + 4 < bookMeta.pages) {
          getSpreadPages(pageIndex + 4).forEach(p => pagesToWarm.add(p));
        }

        for (const pNum of pagesToWarm) {
          if (pNum >= 1 && pNum <= bookMeta.pages) {
            renderPage(pNum, targetW, targetH).then(dataUrl => {
              applyPageImageToFlip(pNum - 1, dataUrl);
            });
          }
        }
      }

      // Jump to page action
      btnJumpGo.addEventListener('click', performPageJump);

      jumpInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') performPageJump();
      });

      async function performPageJump() {
        if (!flip || !bookMeta) return;
        const pageNum = parseInt(jumpInput.value, 10);
        if (isNaN(pageNum) || pageNum < 1 || pageNum > bookMeta.pages) {
          jumpInput.style.borderColor = 'var(--danger)';
          setTimeout(() => jumpInput.style.borderColor = '', 1000);
          return;
        }
        jumpPopover.classList.remove('active');
        const targetIdx = pageNum - 1;

        if (pdfDoc) {
          const dims = calculateDimensions();
          const targetPages = getSpreadPages(targetIdx);
          await Promise.all(targetPages.map(p => renderPage(p, dims.width, dims.height).then(dataUrl => {
            applyPageImageToFlip(p - 1, dataUrl);
          })));
        }

        flip.flip(targetIdx);
      }

      const resumeToast = document.getElementById('resume-toast');
      const resumeToastText = document.getElementById('resume-toast-text');
      const btnResumeContinue = document.getElementById('btn-resume-continue');
      const btnResumeStart = document.getElementById('btn-resume-start');

      function saveReadingState(currentPage) {
        if (!bookMeta || !id) return;
        try {
          localStorage.setItem('flip_pos_' + id, currentPage);
          const raw = localStorage.getItem('flip_recent_books');
          let list = raw ? JSON.parse(raw) : [];
          list = list.filter(item => item.id !== id);
          list.unshift({
            id: id,
            title: bookMeta.title || bookMeta.filename || "Flipbook",
            pages: bookMeta.pages,
            lastPage: currentPage,
            timestamp: Date.now()
          });
          if (list.length > 8) list = list.slice(0, 8);
          localStorage.setItem('flip_recent_books', JSON.stringify(list));
        } catch (e) {}
      }

      // Initialize reader
      async function init() {
        const loadingText = document.getElementById('loading-msg') || document.getElementById('loading-text');
        const wakeupTimer = setTimeout(() => {
          if (loadingText) loadingText.textContent = "Preparing your flipbook...";
        }, 3000);

        try {
          const res = await fetch(getFlipApiUrl('/api/books/' + encodeURIComponent(id)));
          clearTimeout(wakeupTimer);
          if (!res.ok) {
            throw new Error("This flipbook could not be found or has expired.");
          }
          bookMeta = await res.json();

          if (!bookMeta || !bookMeta.pages || bookMeta.pages < 1) {
            throw new Error("This book contains no readable pages.");
          }

          // Document title
          const title = bookMeta.title || bookMeta.filename || "Flipbook";
          bookTitleEl.textContent = title;
          bookTitleEl.title = title;
          document.title = title + " — FlipBook Reader";

          jumpInput.max = bookMeta.pages;

          // Try loading PDF via PDF.js for crisp high-resolution rendering
          if (window.pdfjsLib) {
            try {
              pdfjsLib.GlobalWorkerOptions.workerSrc = '/pdfjs/pdf.worker.min.js';
              const loadingTask = pdfjsLib.getDocument({
                url: getFlipApiUrl('/api/books/' + encodeURIComponent(id) + '/pdf'),
                isEvalSupported: true,
                useSystemFonts: true
              });
              pdfDoc = await loadingTask.promise;
              const firstPage = await pdfDoc.getPage(1);
              const unscaled = firstPage.getViewport({ scale: 1.0 });
              bookMeta.width = unscaled.width;
              bookMeta.height = unscaled.height;
            } catch (pdfErr) {
              console.warn("Could not load original PDF via PDF.js, using raster fallback:", pdfErr);
              pdfDoc = null;
            }
          }

          // Check URL param or stored reading position
          const urlParams = new URLSearchParams(window.location.search);
          const pageParam = parseInt(urlParams.get('page'), 10);
          const storedPos = parseInt(localStorage.getItem('flip_pos_' + id), 10);

          let startPage = 0;
          if (!isNaN(pageParam) && pageParam >= 1 && pageParam <= bookMeta.pages) {
            startPage = pageParam - 1;
          }

          await buildFlipbook(startPage);

          // Prompt to continue if a saved position > 1 exists
          if (isNaN(pageParam) && !isNaN(storedPos) && storedPos > 1 && storedPos <= bookMeta.pages) {
            resumeToastText.textContent = `Continue from page ${storedPos}?`;
            resumeToast.style.display = 'flex';

            btnResumeContinue.onclick = () => {
              if (flip) {
                try { flip.flip(storedPos - 1); } catch (e) {}
              }
              resumeToast.style.display = 'none';
            };

            btnResumeStart.onclick = () => {
              resumeToast.style.display = 'none';
            };

            setTimeout(() => {
              resumeToast.style.display = 'none';
            }, 9000);
          }
        } catch (err) {
          showError("Unable to Load Flipbook", err.message);
        }
      }

      /**
       * Calculates viewport constraints dynamically.
       * ZERO body scrolling: fits within viewport clientWidth & clientHeight.
       */
      function calculateDimensions() {
        const availW = Math.max(280, viewportEl.clientWidth - 32);
        const availH = Math.max(260, viewportEl.clientHeight - 24);

        const isMobile = window.innerWidth < 768 || availW < availH * 1.05;
        const origW = (bookMeta && bookMeta.width > 0) ? bookMeta.width : 600;
        const origH = (bookMeta && bookMeta.height > 0) ? bookMeta.height : 800;
        const aspect = origW / origH;

        let pageW, pageH;

        if (isMobile) {
          let targetW = Math.min(availW, 680);
          let targetH = targetW / aspect;
          if (targetH > availH) {
            targetH = availH;
            targetW = targetH * aspect;
          }
          pageW = Math.round(targetW);
          pageH = Math.round(targetH);
        } else {
          let targetSpreadW = Math.min(availW, 1500);
          let targetPageW = targetSpreadW / 2;
          let targetH = targetPageW / aspect;
          if (targetH > availH) {
            targetH = availH;
            targetPageW = targetH * aspect;
          }
          pageW = Math.round(targetPageW);
          pageH = Math.round(targetH);
        }

        return {
          width: Math.max(160, pageW),
          height: Math.max(220, pageH),
          isMobile: isMobile
        };
      }

      function updateCounter() {
        if (!flip || !bookMeta) return;
        const currentZeroBased = flip.getCurrentPageIndex() || 0;
        const currentPage = currentZeroBased + 1;
        const total = bookMeta.pages;

        const text = `Page ${currentPage} / ${total}`;
        pageCounterText.textContent = text;
        bottomCounter.textContent = text;
        jumpInput.value = currentPage;

        btnPrev.disabled = currentZeroBased <= 0;
        btnNext.disabled = currentZeroBased >= total - 1;

        if (pdfDoc) {
          const dims = calculateDimensions();
          warmPagesAround(currentZeroBased, dims.width, dims.height);
        }

        saveReadingState(currentPage);
      }

      async function buildFlipbook(startPageIndex) {
        if (typeof St === 'undefined' || !St.PageFlip) {
          showError("Library Error", "The page-flip library could not be initialized.");
          return;
        }

        const dims = calculateDimensions();
        bookStageEl.innerHTML = '<div id="book"></div>';
        const bookEl = document.getElementById('book');

        flip = new St.PageFlip(bookEl, {
          width: dims.width,
          height: dims.height,
          size: 'fixed',
          showCover: true,
          usePortrait: dims.isMobile,
          startPage: Math.min(startPageIndex, bookMeta.pages - 1),
          maxShadowOpacity: 0.55,
          mobileScrollSupport: false
        });

        if (pdfDoc) {
          const initialPages = new Array(bookMeta.pages).fill(PLACEHOLDER);
          const startSpread = getSpreadPages(startPageIndex);
          await Promise.all(startSpread.map(async (p) => {
            const dataUrl = await renderPage(p, dims.width, dims.height);
            initialPages[p - 1] = dataUrl;
          }));
          flip.loadFromImages(initialPages);
        } else {
          const fmt = bookMeta.format || 'jpg';
          const loadingMsg = document.getElementById('loading-msg') || document.getElementById('loading-text');
          if (loadingMsg) loadingMsg.textContent = "Preparing your flipbook...";

          // Ensure raster pages are available before loading fallback
          const testPageUrl = getFlipApiUrl(`/books/${id}/page-1.${fmt}`);
          for (let attempt = 0; attempt < 25; attempt++) {
            try {
              const chk = await fetch(testPageUrl, { method: 'HEAD', cache: 'no-cache' });
              if (chk.ok) break;
            } catch (e) {}
            await new Promise(r => setTimeout(r, 1000));
          }

          const pages = Array.from({ length: bookMeta.pages }, (_, i) => getFlipApiUrl(`/books/${id}/page-${i + 1}.${fmt}`));
          flip.loadFromImages(pages);
        }

        flip.on('flip', updateCounter);
        flip.on('init', () => {
          updateCounter();
          loadingOverlay.classList.add('hidden');
          setTimeout(() => loadingOverlay.style.display = 'none', 350);
          isInitialized = true;
        });

        // Navigation button events
        btnPrev.onclick = () => {
          if (!flip) return;
          const idx = flip.getCurrentPageIndex() || 0;
          if (idx > 0) {
            if (pdfDoc) {
              const dims = calculateDimensions();
              const prevPages = getSpreadPages(Math.max(0, idx - 2));
              prevPages.forEach(p => renderPage(p, dims.width, dims.height).then(dataUrl => applyPageImageToFlip(p - 1, dataUrl)));
            }
            flip.flipPrev();
          }
        };

        btnNext.onclick = () => {
          if (!flip) return;
          const idx = flip.getCurrentPageIndex() || 0;
          if (idx < bookMeta.pages - 1) {
            if (pdfDoc) {
              const dims = calculateDimensions();
              const nextPages = getSpreadPages(Math.min(bookMeta.pages - 1, idx + 2));
              nextPages.forEach(p => renderPage(p, dims.width, dims.height).then(dataUrl => applyPageImageToFlip(p - 1, dataUrl)));
            }
            flip.flipNext();
          }
        };
      }

      // Keyboard navigation
      window.addEventListener('keydown', (e) => {
        if (!flip || !isInitialized) return;
        if (document.activeElement === jumpInput) return;

        if (e.key === 'ArrowLeft') {
          flip.flipPrev();
        } else if (e.key === 'ArrowRight') {
          flip.flipNext();
        } else if (e.key === 'Home') {
          flip.flip(0);
        } else if (e.key === 'End' && bookMeta) {
          flip.flip(bookMeta.pages - 1);
        }
      });

      // Fullscreen handling
      btnFullscreen.addEventListener('click', toggleFullscreen);

      function toggleFullscreen() {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          document.exitFullscreen().catch(() => {});
        }
      }

      document.addEventListener('fullscreenchange', () => {
        if (document.fullscreenElement) {
          fullscreenText.textContent = 'Exit';
        } else {
          fullscreenText.textContent = 'Fullscreen';
        }
        recalcAndResize();
      });

      // Dynamic resize handling with debouncing
      let resizeTimeout = null;
      function recalcAndResize() {
        if (!flip || !bookMeta || !isInitialized) return;
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
          const current = flip.getCurrentPageIndex() || 0;
          try { flip.destroy(); } catch (e) {}
          buildFlipbook(current);
        }, 180);
      }

      window.addEventListener('resize', recalcAndResize);
      window.addEventListener('orientationchange', recalcAndResize);

      if (window.ResizeObserver) {
        const ro = new ResizeObserver(() => {
          if (isInitialized) recalcAndResize();
        });
        ro.observe(viewportEl);
      }

      function showError(title, message) {
        loadingOverlay.style.display = 'none';
        errorTitle.textContent = title;
        errorDesc.textContent = message;
        errorOverlay.style.display = 'flex';
      }

      init();
    })();
  </script>
</body>
</html>
